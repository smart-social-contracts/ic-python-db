name: Test without IC

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install .
        
    - name: Run tests
      run: |
        cd tests && ./run_test.sh

    # These two are written for pytest (fixtures, pytest.raises), not for
    # tests/src/tester.py, so run_test.sh and the canister cannot run them.
    - name: Run the pytest-only tests
      run: python -m pytest tests/src/tests/test_context.py tests/src/tests/test_hooks.py --no-cov

