name: Scaling suite

# Checks that every public operation stays bounded as data grows (see
# tests/src/scaling_cases.py). The local suite counts storage operations and
# runs in seconds; the canister suite measures IC instructions.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
          pip install .

      - name: Run the local scaling suite
        run: python -m pytest tests/scaling -rxX --no-cov

  canister:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the canister scaling suite
        run: |
          cd tests && ./run_test_ic_scaling.sh 2>&1 | tee scaling-output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaling-results
          path: tests/scaling-output.txt
          retention-days: 90
