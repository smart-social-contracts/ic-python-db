name: Create new release

# Bumps the version, builds the wheel and sdist, and attaches them with a
# checksum file to a *draft* release. Nothing reaches PyPI from here: the
# draft is signed with the release key (sign-release.sh in
# smart-social-contracts/.github), and release-verify.yml then checks the
# signature and uploads exactly the signed files.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine bumpversion

    - name: Bump version
      id: bump_version
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        bumpversion ${{ inputs.release_type }}
        NEW_VERSION=$(grep -Po '(?<=version="|version=\")[^"]*' setup.py)
        BUMP_VERSION=$(grep -Po '(?<=current_version = )[^\s]*' .bumpversion.cfg)
        if [ "$NEW_VERSION" != "$BUMP_VERSION" ]; then
          echo "ERROR: Version mismatch between setup.py ($NEW_VERSION) and .bumpversion.cfg ($BUMP_VERSION)"
          exit 1
        fi
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Build package
      run: |
        python -m build
        twine check dist/*

    - name: Compute checksums
      run: |
        cd dist
        echo "# SHA-256 checksums for release assets" > ../checksums.txt
        sha256sum * >> ../checksums.txt
        cat ../checksums.txt

    - name: Push the version bump
      run: |
        git push origin
        git push origin --tags

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.bump_version.outputs.NEW_VERSION }}
        name: Release v${{ steps.bump_version.outputs.NEW_VERSION }}
        generate_release_notes: true
        # Stays a draft until the checksum file is signed with the release key
        draft: true
        files: |
          dist/*
          checksums.txt
